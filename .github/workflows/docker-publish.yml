name: Publish container

# Publishes ghcr.io/<owner>/tuesday only for version tags, published releases, or a manual run.
# Commits to main do not build or push an image; the Docker smoke job in CI still validates the
# Dockerfile on pull requests.
#
# The repository is named with a trailing dot (`tuesday.`). Docker image names cannot end in a
# dot, so the package is published as `.../tuesday`.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.1.0'
        required: true
        type: string
      force:
        description: 'Rebuild even if this version already exists in GHCR'
        required: false
        type: boolean
        default: false

concurrency:
  group: ghcr-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tuesday
  VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Validate the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION must be a semver tag such as v0.1.0 (got '$VERSION')"
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --tags
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version already exists
        id: exists
        run: |
          if docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
          labels: |
            org.opencontainers.image.title=Tuesday
            org.opencontainers.image.description=Self-hosted work OS — boards, docs, dashboards, automations and optional AI.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        if: steps.exists.outputs.found != 'true' || inputs.force
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summarise
        run: |
          {
            echo "### Tuesday container"
            echo
            if [ "${{ steps.exists.outputs.found }}" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
              echo "Version \`$VERSION\` already exists in GHCR; this run only verified it."
            else
              echo "Published \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\` for linux/amd64 and linux/arm64."
              echo
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            fi
            echo
            echo "Pull with \`docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"
