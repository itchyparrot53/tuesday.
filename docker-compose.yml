services:
  tuesday:
    build: .
    image: tuesday:latest
    ports:
      - '3000:3000'
    environment:
      PORT: ${PORT:-3000}
      DATABASE_PATH: /data/tuesday.db
      UPLOADS_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      AI_FAKE: ${AI_FAKE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_FALLBACK_PORT: ${SMTP_FALLBACK_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FAKE: ${MAIL_FAKE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with SSO}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-member}
      OIDC_ONLY: ${OIDC_ONLY:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_FAKE: ${PUSH_FAKE:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-tuesday/}
      BACKUP_S3_KEEP: ${BACKUP_S3_KEEP:-30}
      BACKUP_S3_FAKE: ${BACKUP_S3_FAKE:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
    volumes:
      - tuesday-data:/data
    restart: unless-stopped

volumes:
  tuesday-data:
